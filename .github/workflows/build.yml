name: Validar build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/admin-only-inventory-access]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Validar build
        run: npm run build
